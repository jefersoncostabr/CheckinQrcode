<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoramento facial de presença</title>
    <link rel="stylesheet" href="/checkin.css">
    <style>
        body.monitoring-active {
            overflow: hidden;
            background: #0c141c;
        }

        .monitor-panel {
            width: min(100%, 520px);
            box-sizing: border-box;
            margin: 0 auto;
            padding: 24px;
            border-radius: 12px;
            background: #fff;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.12);
        }

        .monitor-panel select {
            width: 100%;
            min-height: 44px;
            margin: 8px 0 16px;
        }

        .monitor-consent {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            line-height: 1.5;
            margin: 18px 0;
        }

        .monitor-actions {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
        }

        .monitor-panel.capture-active {
            position: fixed;
            z-index: 10;
            inset: 0;
            display: grid;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            max-width: none;
            box-sizing: border-box;
            align-content: center;
            justify-items: center;
            gap: 12px;
            margin: 0;
            padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom));
            overflow: hidden;
            border-radius: 0;
            background: #0c141c;
            color: #fff;
            box-shadow: none;
        }

        .monitor-panel.capture-active > :not(.face-camera-stage):not(#monitorStatus):not(#monitorStop) {
            display: none;
        }

        .monitor-panel.capture-active .face-camera-stage {
            width: min(100%, 900px);
            max-height: min(68dvh, calc(100dvh - 150px));
            margin: 0;
        }

        #monitorStatus {
            min-height: 3em;
            max-width: 760px;
            margin: 0;
            font-weight: 600;
            text-align: center;
        }

        #monitorVideo {
            width: 100%;
            height: 100%;
            background: #111;
            object-fit: cover;
            transform: scaleX(-1);
        }

        #monitorStop {
            min-height: 48px;
        }

        .monitor-panel[data-capture-state="procurando"] .face-guide,
        .monitor-panel[data-capture-state="ajuste"] .face-guide {
            border-color: #ff6868;
            box-shadow: 0 0 0 999px rgba(4, 12, 20, 0.42), 0 0 20px rgba(255, 104, 104, 0.5);
        }

        .monitor-panel[data-capture-state="alinhado"] .face-guide,
        .monitor-panel[data-capture-state="sucesso"] .face-guide {
            border-color: #36d399;
            box-shadow: 0 0 0 999px rgba(4, 12, 20, 0.42), 0 0 24px rgba(54, 211, 153, 0.65);
        }

        @media (max-width: 600px) {
            .monitor-panel.capture-active {
                padding-left: 12px;
                padding-right: 12px;
            }

            .monitor-panel.capture-active .face-camera-stage {
                width: 100%;
                aspect-ratio: 3 / 4;
                max-height: min(65dvh, calc(100dvh - 150px));
            }

            .monitor-panel.capture-active .face-guide {
                width: 62%;
                height: 68%;
            }
        }
    </style>
    <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <script defer src="/faceRecognition.js"></script>
    <script defer src="/admFaceMonitor.js"></script>
</head>
<body>
    <main id="monitorPanel" class="monitor-panel">
        <h1>Monitoramento facial de presença</h1>

        <p>
            Selecione uma sala aberta. O monitoramento só começa ao clicar em
            "Iniciar" e para quando você clicar em "Parar" ou fechar esta página.
        </p>

        <label for="monitorSala">Sala para registrar a presença</label>
        <select id="monitorSala" required>
            <option value="">Carregando salas...</option>
        </select>

        <label class="monitor-consent">
            <input id="monitorConsent" type="checkbox">
            <span>
                Confirmo que as pessoas foram informadas e consentiram com a
                verificação facial para registrar presença nesta sala.
            </span>
        </label>

        <div class="monitor-actions">
            <button id="monitorStart" type="button" disabled>Iniciar monitoramento</button>
            <a href="/adm">Voltar ao painel</a>
        </div>

        <p id="monitorStatus" role="status" aria-live="polite">
            Carregando as salas disponíveis...
        </p>

        <div id="monitorCameraStage" class="face-camera-stage" hidden>
            <video id="monitorVideo" autoplay muted playsinline hidden></video>
            <div class="face-guide" aria-hidden="true"></div>
        </div>
        <button id="monitorStop" type="button" disabled hidden>Parar monitoramento</button>
    </main>
</body>
</html>
