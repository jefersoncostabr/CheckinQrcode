<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor de presença por biometria</title>
    <link rel="stylesheet" href="/admEstilo.css">
    <style>
        body.monitoring-active { overflow: hidden; background: #0c141c; }
        .monitor-card { width: min(100% - 32px, 900px); margin: 32px auto; padding: 24px; background: #fff; border-radius: 12px; }
        .monitor-fields { display: grid; gap: 14px; max-width: 560px; }
        .monitor-fields select { min-height: 42px; }
        .monitor-consent { display: flex; gap: 8px; align-items: flex-start; line-height: 1.5; }
        .monitor-fields .actions { justify-content: flex-start; gap: 10px; }
        .monitor-panel button { min-height: 48px; padding: 11px 18px; border: 1px solid #53677a; border-radius: 6px; background: #fff; color: #23384d; font-weight: 600; line-height: 1.4; transition: background-color 0.2s, border-color 0.2s; }
        .monitor-panel button:hover:not(:disabled) { background: #edf1f4; transform: none; }
        .monitor-panel button:focus-visible { outline: 3px solid #557fa1; outline-offset: 3px; }
        .monitor-panel button:disabled { border-color: #b7c1ca; background: #e5e9ed; color: #4d5b68; cursor: not-allowed; }
        .monitor-panel #monitorStart:not(:disabled) { border-color: #23384d; background: #23384d; color: #fff; }
        .monitor-panel #monitorStart:hover:not(:disabled) { background: #172a3b; }
        .face-camera-stage, .qr-camera { position: relative; display: grid; width: min(100%, 760px); aspect-ratio: 4 / 3; margin: 20px auto; overflow: hidden; background: #101820; border-radius: 18px; }
        .face-camera-stage video, .qr-camera video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        .face-guide { position: absolute; top: 50%; left: 50%; width: 48%; height: 72%; border: 4px solid #f4b740; border-radius: 50%; box-shadow: 0 0 0 999px rgba(4, 12, 20, 0.42), 0 0 20px rgba(244, 183, 64, 0.45); transform: translate(-50%, -50%); pointer-events: none; transition: border-color 180ms ease, box-shadow 180ms ease; }
        .monitor-panel[data-capture-state="procurando"] .face-guide,
        .monitor-panel[data-capture-state="ajuste"] .face-guide { border-color: #ff6868; box-shadow: 0 0 0 999px rgba(4, 12, 20, 0.42), 0 0 20px rgba(255, 104, 104, 0.5); }
        .monitor-panel[data-capture-state="alinhado"] .face-guide,
        .monitor-panel[data-capture-state="sucesso"] .face-guide { border-color: #36d399; box-shadow: 0 0 0 999px rgba(4, 12, 20, 0.42), 0 0 24px rgba(54, 211, 153, 0.65); }
        #monitorStatus, #statusQrSala { min-height: 1.5em; }
        #monitorStatus { min-height: 3em; max-width: 760px; margin: 0; font-weight: 700; text-align: center; }
        .monitor-panel.capture-active { position: fixed; z-index: 10; inset: 0; width: 100%; height: 100vh; height: 100dvh; max-width: none; box-sizing: border-box; margin: 0; padding: 0; overflow: hidden; border-radius: 0; background: #0c141c; color: #fff; box-shadow: none; }
        .monitor-panel.capture-active > :not(.face-camera-stage):not(#monitorStatus):not(#monitorStop) { display: none; }
        .monitor-panel.capture-active .face-camera-stage { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; aspect-ratio: auto; border-radius: 0; }
        .monitor-panel.capture-active .face-camera-stage video { position: absolute; inset: 0; width: 100%; height: 100%; }
        .monitor-panel.capture-active .face-guide { width: min(62vw, 45vh); height: min(62vh, 85vw); }
        .monitor-panel.capture-active #monitorStatus { position: absolute; z-index: 1; top: max(16px, env(safe-area-inset-top)); left: 50%; width: min(90%, 760px); min-height: 0; box-sizing: border-box; padding: 12px 16px; border-radius: 8px; background: rgba(4, 12, 20, 0.8); transform: translateX(-50%); }
        .monitor-panel.capture-active #monitorStop { position: absolute; z-index: 1; bottom: max(16px, env(safe-area-inset-bottom)); left: 50%; border-color: #d3dce4; background: #23384d; color: #fff; transform: translateX(-50%); }
        .monitor-panel.capture-active #monitorStop:hover:not(:disabled) { background: #172a3b; transform: translateX(-50%); }
        .monitor-panel.capture-active #monitorStop:focus-visible { outline-color: #fff; }
        [hidden] { display: none !important; }
    </style>
</head>
<body>
    <main id="monitorPanel" class="monitor-panel monitor-card">
        <h1>Monitor de presença por biometria</h1>
        <p>O vídeo é processado no dispositivo. O servidor recebe apenas descritores faciais para comparar perfis desta organização.</p>
        <div class="monitor-fields">
            <label for="monitorSala">Sala aberta</label>
            <select id="monitorSala"></select>
            <label class="monitor-consent" for="monitorConsent">
                <input id="monitorConsent" type="checkbox">
                <span>Confirme que as pessoas foram informadas e consentiram com o uso da biometria para registrar presença.</span>
            </label>
            <div class="actions">
                <button id="monitorStart" type="button">Iniciar monitoramento</button>
                <button id="lerQrSala" type="button">Ler QR da sala</button>
                <button id="pararLeituraQr" type="button" hidden>Cancelar leitura</button>
            </div>
        </div>
        <p id="monitorStatus" role="status" aria-live="polite">Carregando salas...</p>
        <section id="qrCameraStage" class="qr-camera" hidden>
            <video id="videoQrSala" autoplay muted playsinline></video>
        </section>
        <p id="statusQrSala" role="status" aria-live="polite"></p>
        <section id="monitorCameraStage" class="face-camera-stage" hidden>
            <video id="monitorVideo" autoplay muted playsinline></video>
            <div class="face-guide" aria-hidden="true"></div>
        </section>
        <button id="monitorStop" type="button" disabled hidden>Parar câmera</button>
        <p><a href="/adm">Voltar ao painel</a></p>
    </main>
    <script defer src="https://unpkg.com/@zxing/browser@0.1.5/umd/index.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <script defer src="/faceRecognition.js"></script>
    <script defer src="/admFaceMonitor.js"></script>
</body>
</html>
