<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Tela de criação de conta do Check-in." />
    <title>Criar conta - Check-in</title>
    <link rel="stylesheet" href="/auth.css" />
    <link rel="stylesheet" href="/botoes.css" />
</head>
<body>
    <main class="auth-card">
        <div class="brand" aria-label="Check-in">
            <span class="brand-mark" aria-hidden="true">C</span>
            <span>Check-in</span>
        </div>

        <h1>Crie sua conta</h1>
        <p class="auth-subtitle">Preencha seus dados para começar a organizar suas presenças.</p>
        <div id="message" class="auth-message" role="status" aria-live="polite" hidden></div>

        <form class="auth-form" id="registerForm">
            <label for="tenantName">Nome da organização</label>
            <input id="tenantName" name="tenantName" type="text" autocomplete="organization" maxlength="120" placeholder="Minha organização" required />

            <label for="name">Nome completo</label>
            <input id="name" name="name" type="text" autocomplete="name" maxlength="120" placeholder="Seu nome" required />

            <label for="email">E-mail</label>
            <input id="email" name="email" type="email" autocomplete="email" maxlength="254" placeholder="voce@exemplo.com" required />

            <label for="password">Senha</label>
            <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" placeholder="Crie uma senha" required />

            <label for="passwordConfirmation">Confirmar senha</label>
            <input id="passwordConfirmation" name="passwordConfirmation" type="password" autocomplete="new-password" minlength="8" placeholder="Digite a senha novamente" required />

            <button class="auth-button" type="submit">Criar conta</button>
        </form>

        <p class="auth-footer">Já tem uma conta? <a class="auth-link" href="/login">Entrar</a></p>
        <p class="auth-note">A primeira conta criada para uma organização recebe o papel de owner.</p>
    </main>
    <script>
        const form = document.getElementById('registerForm');
        const message = document.getElementById('message');
        const submitButton = form.querySelector('button[type="submit"]');

        function showMessage(text, isError = false) {
            message.textContent = text;
            message.classList.toggle('error', isError);
            message.classList.toggle('success', !isError);
            message.hidden = false;
        }

        form.addEventListener('submit', async event => {
            event.preventDefault();
            if (form.elements.password.value !== form.elements.passwordConfirmation.value) {
                showMessage('As senhas não coincidem.', true);
                return;
            }

            submitButton.disabled = true;
            try {
                const response = await fetch('/api/tenant/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        tenantName: form.elements.tenantName.value,
                        name: form.elements.name.value,
                        email: form.elements.email.value,
                        password: form.elements.password.value,
                    }),
                });
                const result = await response.json();
                if (!response.ok) throw new Error(result.mensagem || 'Não foi possível criar a conta.');
                showMessage('Conta e organização criadas. Abrindo o painel...');
                window.location.replace('/adm');
            } catch (error) {
                showMessage(error.message, true);
            } finally {
                submitButton.disabled = false;
            }
        });
    </script>
</body>
</html>
