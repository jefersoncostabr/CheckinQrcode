<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check-in</title>
    <link rel="stylesheet" href="checkin.css">
    <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <script defer src="/faceRecognition.js"></script>
    <script defer src="/checkin.js"></script>
    <link rel="stylesheet" href="/botoes.css">
</head>
<body>
    <h1>Check-in de Presença</h1>
    <p id="salaStatus" role="status">Verificando sala...</p>

    <div class="checkin-manual">
        <label for="nomeInput">Nome completo</label>
        <input id="nomeInput" type="text" maxlength="120"
            autocomplete="name" disabled>

        <label for="senhaInput">Senha</label>
        <input id="senhaInput" type="password"
            autocomplete="current-password" disabled>

        <button id="btnCriarConta" type="button" disabled aria-label="Criar conta e confirmar presença" title="Criar conta e confirmar presença">Criar conta e confirmar presença</button>

        <button id="btnEntrar" type="button" disabled aria-label="Entrar com conta existente" title="Entrar com conta existente">Entrar</button>

        <button id="btnConfirmar" type="button" disabled hidden aria-label="Confirmar presença na sala" title="Confirmar presença na sala">Confirmar presença</button>

        <button id="btnSair" type="button" hidden aria-label="Sair da conta" title="Sair da conta">Sair da conta</button>

        <p id="statusConta" role="status" aria-live="polite"></p>
    </div>

    <section id="facePanel" class="face-panel" hidden>
        <h2>Ou use reconhecimento facial</h2>
        <p>A câmera analisa seu rosto neste dispositivo. O sistema envia e armazena somente um descritor matemático, não a foto. O reconhecimento pode falhar; o check-in pelo nome continua disponível.</p>
        <label class="consentimento">
            <input id="faceConsent" type="checkbox">
            Concordo com o uso do meu rosto para identificação neste check-in e, se eu me cadastrar, com o armazenamento do descritor facial até que eu o exclua.
        </label>

        <div class="face-register">
            <label for="faceName">Nome para cadastrar meu rosto</label>
            <input id="faceName" type="text" maxlength="120" placeholder="Digite seu nome completo">
            <button id="faceEnrollBtn" type="button" aria-label="Cadastrar meu rosto para reconhecimento facial" title="Cadastrar meu rosto para reconhecimento facial">Cadastrar meu rosto</button>
        </div>

        <button id="faceCheckinBtn" type="button" aria-label="Fazer check-in com reconhecimento facial" title="Fazer check-in com reconhecimento facial">Fazer check-in com meu rosto</button>
        <div id="faceCameraStage" class="face-camera-stage" hidden>
            <video id="faceVideo" autoplay muted playsinline hidden></video>
            <div class="face-guide" aria-hidden="true"></div>
        </div>
        <p id="faceStatus" role="status" aria-live="polite"></p>
        <button id="faceCaptureCancel" type="button" class="secondary" hidden aria-label="Cancelar captura facial" title="Cancelar captura facial">Cancelar captura</button>
        <button id="faceDeleteBtn" type="button" class="secondary" hidden aria-label="Excluir meu cadastro facial deste dispositivo" title="Excluir meu cadastro facial deste dispositivo">Excluir meu cadastro facial deste dispositivo</button>
    </section>
</body>
</html>
