<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check-in</title>
    <link rel="stylesheet" href="checkin.css">
    <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <script defer src="/faceRecognition.js"></script>
    <script defer src="/checkin.js"></script>
</head>
<body>
    <h1>Check-in de Presença</h1>
    <p id="salaStatus" role="status">Verificando sala...</p>

    <div class="checkin-manual">
        <label for="nomeInput">Check-in pelo nome</label>
        <input type="text" id="nomeInput" placeholder="Digite seu nome completo" required disabled>
    </div>
    <button id="btn" onclick="confirmar()" disabled>Confirmar Presença</button>

    <section id="facePanel" class="face-panel" hidden>
        <h2>Ou use reconhecimento facial</h2>
        <p>A câmera analisa seu rosto neste dispositivo. O sistema envia e armazena somente um descritor matemático, não a foto. O reconhecimento pode falhar; o check-in pelo nome continua disponível.</p>
        <label class="consentimento">
            <input id="faceConsent" type="checkbox">
            Concordo com o uso do meu rosto para identificação neste check-in e, se eu me cadastrar, com o armazenamento do descritor facial até que eu o exclua.
        </label>

        <div class="face-register">
            <label for="faceName">Nome para cadastrar meu rosto</label>
            <input id="faceName" type="text" maxlength="120" placeholder="Digite seu nome completo">
            <button id="faceEnrollBtn" type="button">Cadastrar meu rosto</button>
        </div>

        <button id="faceCheckinBtn" type="button">Fazer check-in com meu rosto</button>
        <video id="faceVideo" autoplay muted playsinline hidden></video>
        <p id="faceStatus" role="status" aria-live="polite"></p>
        <button id="faceDeleteBtn" type="button" class="secondary" hidden>Excluir meu cadastro facial deste dispositivo</button>
    </section>
</body>
</html>
